name: itcs355-training-pipeline
schedule: TZ=Asia/Bangkok 0 2 * * 0
steps:
- name: ingest
  image: ${PIPELINE_IMAGE}
  command:
  - python
  - -m
  - cloudlayer.lab5_stage
  outputs:
  - raw_data
  stage: ingest
- name: validate
  image: ${PIPELINE_IMAGE}
  command:
  - python
  - -m
  - cloudlayer.lab5_stage
  depends_on:
  - ingest
  on_failure: abort
  stage: validate
- name: train
  image: ${PIPELINE_IMAGE}
  command:
  - python
  - -m
  - cloudlayer.lab5_stage
  depends_on:
  - validate
  instance: n1-standard-4
  spot: true
  outputs:
  - model
  - metrics
  stage: train
- name: evaluate
  image: ${PIPELINE_IMAGE}
  command:
  - python
  - -m
  - cloudlayer.lab5_stage
  depends_on:
  - train
  outputs:
  - gate_decision
  stage: evaluate
- name: register
  image: ${PIPELINE_IMAGE}
  command:
  - python
  - -m
  - cloudlayer.lab5_stage
  depends_on:
  - evaluate
  condition: gate_decision == 'pass'
  stage: register
- name: deploy_staging
  image: ${PIPELINE_IMAGE}
  command:
  - python
  - -m
  - cloudlayer.lab5_stage
  depends_on:
  - register
  stage: deploy_staging
tags:
  course: itcs355
  student: ${PROJECT_ID}
  lab: '5'
