name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Lint
        run: ruff check src/ service/ monitoring/ scripts/ tests/ cloudlayer/
      - name: Portability audit
        run: python scripts/portability_audit.py
      - name: Generate dataset
        run: python scripts/make_dataset.py
      - name: Unit tests
        run: pytest -q tests/test_drift.py tests/test_data.py -k 'drift or split or fingerprint'
      - name: Data contract tests
        run: pytest -q tests/test_data.py
      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py
      - name: Service and adapter tests
        run: pytest -q tests --ignore=tests/test_data.py --ignore=tests/test_model_behaviour.py --ignore=tests/test_drift.py
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Build serving image tagged by tested commit
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve --build-arg SOURCE_COMMIT=${{ github.sha }} -t itcs355-serve:${{ github.sha }} --load .
      - name: Integration test
        run: |
          set -euo pipefail
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib
          docker run -d --name svc -p 8080:8080 -v "$PWD/reports:/app/reports:ro" -e MODEL_PATH=/app/reports/model.joblib -e MODEL_VERSION=${{ github.sha }} itcs355-serve:${{ github.sha }}
          python scripts/container_smoke.py --version '${{ github.sha }}'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs svc || true
          docker rm -f svc || true
      - name: Export tested image for CD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save itcs355-serve:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-serving-image
          path: image.tar
          retention-days: 1
