name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: lab4-staging
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.LAB4_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      # workflow_run's github.sha can differ: deploy the SHA that actually passed CI.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUD_PROVIDER: gcp
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      BLOB_URI: ${{ vars.BLOB_URI }}
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      IDENTITY_REF: ${{ vars.GCP_DEPLOY_SA }}
      SERVING_IDENTITY_REF: ${{ vars.SERVING_IDENTITY_REF }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      SERVING_LAB: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: tested-serving-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r requirements.txt
      - name: Push exactly the image CI tested
        run: |
          set -euo pipefail
          docker load -i image.tar
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          python scripts/lab4_cd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence
          path: reports/lab4-staging.json
          retention-days: 7
