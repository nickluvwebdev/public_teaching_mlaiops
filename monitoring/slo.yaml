service: itcs355-predict
objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "2xx and 3xx predictions / all non-4xx prediction responses; track 4xx separately."
    rationale: "A lab target permitting at most 0.5% server failures, not yet proven by a 30-day run."
    on_budget_exhausted: "Freeze model releases, inspect upstream and serving errors, and roll back only when the release caused the failure; resume after recovery is verified."
  - name: latency
    target_p95_ms: 500
    window: 7d
    measurement: "Cloud Run endpoint request latency for prediction traffic, including cold requests; separate startup analysis from warm Lab 3 measurements."
    on_budget_exhausted: "Pause promotions and investigate cold starts, queueing and payload changes; verify the fix with the committed load test before resuming."
  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "Age of the exact registered production model version."
    on_budget_exhausted: "Request a labelled-data evaluation and owner review; retrain only on valid data if degradation or persistent legitimate drift warrants it, and document any age exception."
